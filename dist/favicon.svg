<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#brandGrad)" filter="url(#glow)"/>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3"/>
  <!-- Character "榜" -->
  <text x="64" y="90" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="78" font-weight="900" text-anchor="middle">榜</text>
</svg>